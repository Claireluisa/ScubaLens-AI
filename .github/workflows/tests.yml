name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell safety and masking tests
        shell: pwsh
        run: ./tests/Test-ScubaLens.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OSCAL export validation
        run: |
          pip install compliance-trestle
          python tests/validate_oscal.py
          python tests/validate_oscal.py samples/ScubaLens_OSCAL_CISA_sample.json
